<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Trái Đất 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 14px;
      pointer-events: none;
      backdrop-filter: blur(5px);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="info">🌍 Trái Đất 3D | Kéo để xoay, lăn chuột để phóng to/thu nhỏ</div>

  <!-- Sử dụng import map để tải Three.js từ CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Khởi tạo Scene, Camera, Renderer ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510); // Màu nền không gian sâu thẳm

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Giới hạn để tăng hiệu năng
    document.body.appendChild(renderer.domElement);

    // --- Điều khiển quỹ đạo (kéo, zoom) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;      // Hiệu ứng trượt mượt
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.minDistance = 5;
    controls.maxDistance = 30;
    controls.autoRotate = true;        // Tự động xoay nhẹ quanh trái đất
    controls.autoRotateSpeed = 0.3;
    controls.target.set(0, 0, 0);
    controls.update();

    // --- Ánh sáng ---
    // Ánh sáng môi trường giúp mặt tối không bị đen hoàn toàn
    const ambientLight = new THREE.AmbientLight(0x333344, 1.5);
    scene.add(ambientLight);
    
    // Ánh sáng mặt trời (hướng chính)
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
    sunLight.position.set(5, 3, 8);
    scene.add(sunLight);
    
    // Một chút ánh sáng phụ từ phía bên kia cho rõ chi tiết
    const backLight = new THREE.DirectionalLight(0x4466aa, 0.6);
    backLight.position.set(-5, -1, -5);
    scene.add(backLight);

    // --- Tạo Trái Đất ---
    // Sử dụng texture chất lượng cao từ Three.js examples (NASA visible earth)
    const textureLoader = new THREE.TextureLoader();
    const earthMapUrl = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';
    
    // Tạo hình cầu với độ phân giải cao
    const earthGeometry = new THREE.SphereGeometry(5, 128, 128);
    const earthMaterial = new THREE.MeshPhongMaterial({
      map: textureLoader.load(earthMapUrl),
      shininess: 5,          // Độ bóng nhẹ của đại dương
      specular: new THREE.Color('grey')
    });
    
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);

    // --- Tạo bầu khí quyển mỏng (vòng sáng xanh) ---
    const atmosphereGeometry = new THREE.SphereGeometry(5.08, 64, 64);
    const atmosphereMaterial = new THREE.MeshPhongMaterial({
      color: 0x88aaff,
      transparent: true,
      opacity: 0.08,
      side: THREE.FrontSide,
      blending: THREE.AdditiveBlending
    });
    const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
    scene.add(atmosphere);

    // --- Ngôi sao nền ---
    function createStarField() {
      const starsGeometry = new THREE.BufferGeometry();
      const starCount = 2000;
      const positions = new Float32Array(starCount * 3);
      
      // Phân bố ngẫu nhiên trên mặt cầu lớn
      for (let i = 0; i < starCount * 3; i += 3) {
        // Sử dụng spherical coordinates để sao tập trung ở mọi hướng
        const radius = 40 + Math.random() * 40; // khoảng cách 40-80
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1); // phân bố đều theo diện tích cầu
        
        positions[i] = Math.sin(phi) * Math.cos(theta) * radius;
        positions[i+1] = Math.sin(phi) * Math.sin(theta) * radius;
        positions[i+2] = Math.cos(phi) * radius;
      }
      
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      // Kích thước và màu sắc ngẫu nhiên cho sao
      const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.15,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: true,
      });
      
      const stars = new THREE.Points(starsGeometry, starMaterial);
      scene.add(stars);
      
      // Thêm một lớp sao nhỏ lấp lánh hơn với màu hơi xanh/trắng
      const starsGeometry2 = new THREE.BufferGeometry();
      const positions2 = new Float32Array(1000 * 3);
      for (let i = 0; i < 1000 * 3; i += 3) {
        const radius = 35 + Math.random() * 35;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        positions2[i] = Math.sin(phi) * Math.cos(theta) * radius;
        positions2[i+1] = Math.sin(phi) * Math.sin(theta) * radius;
        positions2[i+2] = Math.cos(phi) * radius;
      }
      starsGeometry2.setAttribute('position', new THREE.BufferAttribute(positions2, 3));
      const starMaterial2 = new THREE.PointsMaterial({
        color: 0xaaccff,
        size: 0.08,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.7,
        sizeAttenuation: true,
      });
      const stars2 = new THREE.Points(starsGeometry2, starMaterial2);
      scene.add(stars2);
    }
    
    createStarField();

    // --- Xử lý sự kiện resize cửa sổ ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Vòng lặp hoạt ảnh ---
    function animate() {
      requestAnimationFrame(animate);
      
      // Trái đất tự quay quanh trục
      earth.rotation.y += 0.002;
      // Bầu khí quyển quay cùng trái đất (có thể quay chậm hơn một chút nếu muốn)
      atmosphere.rotation.y += 0.0018;
      
      // Cập nhật điều khiển (bao gồm autoRotate)
      controls.update();
      
      // Render khung hình
      renderer.render(scene, camera);
    }
    
    animate();
    
    console.log('🌍 Trái Đất 3D đã sẵn sàng!');
  </script>
</body>
</html>
